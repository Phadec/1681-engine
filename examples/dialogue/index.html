<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dialogue playground · 1681 Engine</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b0910; color: #d8d0e8; font: 14px/1.5 monospace; }
      header { padding: 12px 16px; border-bottom: 1px solid #2a2338; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; }
      button, label.file { background: #2a2338; color: #d8d0e8; border: 1px solid #4a3f60; padding: 4px 10px; font: inherit; cursor: pointer; }
      button:hover, label.file:hover { background: #3a3150; }
      button:disabled { opacity: 0.4; cursor: default; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: #2a2338; min-height: calc(100vh - 56px); }
      @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
      section { background: #0b0910; padding: 12px 16px; overflow: auto; }
      h2 { font-size: 13px; color: #a898c8; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
      textarea { width: 100%; height: 45vh; background: #120f1a; color: #e8e0f8; border: 1px solid #2a2338; font: 13px/1.45 monospace; padding: 8px; resize: vertical; }
      .issues div { padding: 2px 0; }
      .error { color: #ff8a8a; }
      .warning { color: #ffd98a; }
      .ok { color: #8ae0a0; }
      .say { margin: 6px 0; padding: 8px 10px; background: #1a1526; border-left: 3px solid #4a3f60; }
      .say b { color: #ffd98a; }
      .say .tags { color: #7a6c96; font-size: 12px; }
      .choices button { display: block; margin: 4px 0; text-align: left; width: 100%; }
      .end { color: #7a6c96; margin: 8px 0; }
      .vars { width: 100%; border-collapse: collapse; }
      .vars td { padding: 2px 6px; border-bottom: 1px solid #1a1526; }
      .vars input { width: 100%; background: #120f1a; color: #e8e0f8; border: 1px solid #2a2338; font: inherit; }
      .nodes .node { padding: 4px 6px; margin: 2px 0; border: 1px solid #1a1526; }
      .nodes .node.here { border-color: #ffd98a; }
      .nodes .node.unreached { opacity: 0.55; }
      .nodes .to { color: #7a6c96; }
      .nodes .to a { color: #a898c8; cursor: pointer; }
      .log { color: #7a6c96; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Dialogue playground</h1>
      <label class="file">Open JSON… <input id="file" type="file" accept=".json,application/json" hidden /></label>
      <button id="restart">Restart</button>
      <button id="download">Save JSON</button>
      <span id="status"></span>
    </header>
    <main>
      <section>
        <h2>Script</h2>
        <textarea id="source" spellcheck="false"></textarea>
        <h2 style="margin-top: 12px">Checks</h2>
        <div id="issues" class="issues"></div>
        <h2 style="margin-top: 12px">Nodes</h2>
        <div id="nodes" class="nodes"></div>
      </section>
      <section>
        <h2>Play</h2>
        <div id="play"></div>
        <h2 style="margin-top: 12px">Variables</h2>
        <table id="vars" class="vars"></table>
        <h2 style="margin-top: 12px">Commands run</h2>
        <div id="log" class="log"></div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
