name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        pixi: ['']
        include:
          # the peer floor: the engine must keep typechecking, testing and building against the oldest Pixi it accepts
          - node: 22
            pixi: '8.6.6'
    name: check (node ${{ matrix.node }}${{ matrix.pixi && format(', pixi.js {0}', matrix.pixi) || '' }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.pixi != ''
        run: npm install --no-save pixi.js@${{ matrix.pixi }}
      - run: npm run check
      # the examples are built for the docs site: an API change that breaks one fails here, not on the next docs deploy
      - run: npm run docs:examples

  # the paths only a real browser runs (WebGL pixels read back, canvas text, FontFace, decodeAudioData, layout), in
  # headless Chromium; kept out of `npm run check`, which stays node-only and fast
  browser:
    runs-on: ubuntu-latest
    name: browser tests (chromium)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
