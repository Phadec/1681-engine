name: Publish

# Publishes to npm through Trusted Publishing (OIDC): no token is kept anywhere. npmjs.com → 1681-engine →
# Settings → Trusted Publisher names this repository and this file. Push a tag `v<version>` to release; a tag already
# pushed is published again from Actions → Publish → Run workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.5.0)'
        required: true

permissions:
  contents: read
  id-token: write

# one release at a time, and never cancelled halfway through a publish
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # no npm cache: a release is built from a clean install, never from a cache another run wrote
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # trusted publishing needs npm 11.5.1 or later; pinned to that line so a new npm major cannot change a release
      - run: npm install -g npm@^11.5.1
      - name: The tag names the package's version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then echo "tag $tag but package.json is $version"; exit 1; fi
      - run: npm ci
      # prepublishOnly runs npm run check (typecheck, tests, build) before anything is sent
      - run: npm publish
